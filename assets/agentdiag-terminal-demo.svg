<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
  <title id="title">AgentDiag v0.1.1 terminal demo</title>
  <desc id="desc">A sanitized terminal capture from the reproducible safe demo fixture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c121a"/><stop offset="1" stop-color="#081015"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1400" height="1120" rx="24" fill="#05080b"/>
  <g filter="url(#shadow)">
    <rect x="28" y="28" width="1344" height="1064" rx="17" fill="url(#bg)" stroke="#263744"/>
    <path d="M28 105h1344" stroke="#263744"/>
    <circle cx="65" cy="67" r="9" fill="#ff665c"/><circle cx="94" cy="67" r="9" fill="#f4be4f"/><circle cx="123" cy="67" r="9" fill="#41c875"/>
